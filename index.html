<style>
:root{
  --paper:#F2F3EE;
  --card:#FBFBF7;
  --ink:#17191C;
  --muted:#71736C;
  --line:#D5D7CC;
  --line-strong:#B7BAAD;
  --stamp:#C22F1D;
  --ok:#1F7A45;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Archivo',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--stamp);color:var(--paper);}
a{color:inherit;}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px;}

/* ---------- grano ---------- */
body::before{content:'';position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:2000;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='table' tableValues='0 0.04'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain 7s steps(9) infinite;}
@keyframes grain{
  0%,100%{transform:translate(0,0);}12%{transform:translate(-3%,2%);}25%{transform:translate(2%,-4%);}
  38%{transform:translate(-4%,-2%);}50%{transform:translate(3%,4%);}62%{transform:translate(-2%,3%);}
  75%{transform:translate(4%,-3%);}88%{transform:translate(-3%,-4%);}
}

/* ---------- cursor ---------- */
@media (hover:hover) and (pointer:fine){
  body{cursor:none;}
  a,button,.hoverable{cursor:none;}
}
#cur,#cur-ring{position:fixed;top:0;left:0;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);}
#cur{width:8px;height:8px;background:var(--stamp);z-index:9999;}
#cur-ring{width:38px;height:38px;border:1.5px solid var(--ink);z-index:9998;opacity:.55;transition:width .35s var(--ease),height .35s var(--ease),opacity .3s,border-color .3s;}
#cur-ring.big{width:64px;height:64px;opacity:.9;border-color:var(--stamp);}
@media (hover:none),(pointer:coarse){#cur,#cur-ring{display:none;}}

/* ---------- utilidades ---------- */
.mono{font-family:var(--mono);}
.display{font-stretch:118%;font-weight:800;line-height:.92;letter-spacing:-.015em;text-transform:uppercase;}
.note{font-family:var(--mono);font-size:10px;font-style:italic;color:var(--muted);letter-spacing:.02em;}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:300;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;justify-content:space-between;}
.tb-id{padding:12px 20px;border-right:1px solid var(--line-strong);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:10px;}
.tb-id .clock{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;}
.tb-nav{display:flex;align-items:center;gap:2px;padding:0 8px;overflow-x:auto;}
.tb-nav a{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:8px 10px;white-space:nowrap;position:relative;}
.tb-nav a::after{content:'';position:absolute;left:10px;right:10px;bottom:4px;height:1px;background:var(--stamp);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease);}
.tb-nav a:hover{color:var(--ink);}
.tb-nav a:hover::after,.tb-nav a.active::after{transform:scaleX(1);transform-origin:left;}
.tb-nav a.active{color:var(--stamp);}
.tb-lang{display:flex;border-left:1px solid var(--line-strong);}
.lb{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:0 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;}
.lb.active{background:var(--ink);color:var(--paper);}

/* ---------- layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 32px;position:relative;}
section{border-bottom:1px solid var(--line-strong);position:relative;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:64px 0 40px;flex-wrap:wrap;}
.sec-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);font-weight:700;}
.sec-title{font-size:clamp(38px,5vw,64px);}
.sec-meta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.margin-note{position:absolute;font-family:var(--mono);font-size:9.5px;font-style:italic;color:var(--muted);letter-spacing:.03em;max-width:130px;line-height:1.7;transform:rotate(-1.5deg);}
.margin-note::before{content:'↘ ';color:var(--stamp);font-style:normal;}

/* ---------- hero ---------- */
#inicio{border-bottom:1px solid var(--ink);}
.hero{display:grid;grid-template-columns:1.45fr 1fr;}
.hero-main{padding:76px 48px 68px 0;border-right:1px solid var(--line-strong);}
.hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:30px;display:flex;align-items:center;gap:12px;}
.hero-eyebrow::before{content:'';width:32px;height:1px;background:var(--ink);}
.hero-name{font-size:clamp(54px,8.5vw,110px);margin-bottom:8px;white-space:nowrap;}
.hero-name .thin{font-weight:250;font-stretch:100%;font-style:italic;text-transform:none;letter-spacing:-.01em;}
.hero-role{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:26px 0;padding:10px 24px 10px 0;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);display:inline-block;}
.hero-desc{font-size:18px;line-height:1.7;max-width:540px;color:#34362F;margin-bottom:38px;}
.hero-desc strong{font-weight:700;color:var(--ink);}
.ctas{display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;padding:14px 26px;position:relative;overflow:hidden;transition:color .3s var(--ease);}
.btn span.fill{position:absolute;inset:0;transform:translateY(101%);transition:transform .45s var(--ease);z-index:0;}
.btn span.tx{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;}
.btn-primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink);}
.btn-primary .fill{background:var(--stamp);}
.btn-primary:hover .fill{transform:translateY(0);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-ghost .fill{background:var(--ink);}
.btn-ghost:hover{color:var(--paper);}
.btn-ghost:hover .fill{transform:translateY(0);}

.hero-side{padding:76px 0 68px 40px;display:flex;flex-direction:column;position:relative;}
.doc-table{border:1px solid var(--ink);background:var(--card);box-shadow:5px 5px 0 rgba(23,25,28,.08);}
.doc-row{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line);}
.doc-row:last-child{border-bottom:none;}
.doc-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-right:1px solid var(--line);display:flex;align-items:center;}
.doc-v{font-family:var(--mono);font-size:12px;font-weight:500;padding:12px 14px;display:flex;align-items:center;gap:8px;}
.dot-ok{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.4s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.stamp{align-self:flex-end;margin:34px 12px 0 0;transform:rotate(-7deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:12px 20px;text-align:center;line-height:1.5;position:relative;user-select:none;transition:transform .4s var(--ease);}
.stamp:hover{transform:rotate(-3deg) scale(1.04);}
.stamp small{display:block;font-size:8px;letter-spacing:.24em;font-weight:400;opacity:.75;}
.stamp::after{content:'';position:absolute;inset:3px;border:1px solid var(--stamp);opacity:.4;}
.hero-metric{margin-top:auto;padding-top:34px;}
.hm-num{font-stretch:118%;font-weight:800;font-size:66px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.hm-num em{font-style:normal;color:var(--stamp);}
.hm-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px;max-width:280px;line-height:1.6;}

/* ---------- cinta ---------- */
.strip{overflow:hidden;border-bottom:1px solid var(--ink);background:var(--ink);padding:9px 0;}
.strip-inner{display:flex;width:max-content;animation:marq 38s linear infinite;}
.strip:hover .strip-inner{animation-play-state:paused;}
@keyframes marq{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.strip span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);padding:0 28px;white-space:nowrap;position:relative;}
.strip span::after{content:'/';position:absolute;right:-4px;color:var(--stamp);}

/* ---------- perfil ---------- */
.perfil-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:72px;padding-bottom:84px;}
.perfil-text p{font-size:17px;line-height:1.75;color:#34362F;margin-bottom:18px;max-width:560px;}
.perfil-text strong{color:var(--ink);}
.perfil-text .hl{background:linear-gradient(transparent 62%,rgba(194,47,29,.18) 62%);}
.proto{display:flex;flex-direction:column;padding-top:10px;}
.proto-item{border:1px solid var(--line-strong);background:var(--card);padding:22px 24px;position:relative;transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease);}
.proto-item+.proto-item{margin-top:-1px;}
.proto-item:nth-child(2){margin-left:22px;}
.proto-item:nth-child(3){margin-left:44px;}
.proto-item:hover{border-color:var(--ink);transform:translateX(-8px);box-shadow:6px 6px 0 rgba(23,25,28,.07);z-index:1;}
.proto-code{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--stamp);font-weight:700;margin-bottom:8px;}
.proto-t{font-weight:700;font-size:16px;margin-bottom:6px;}
.proto-d{font-size:13px;line-height:1.7;color:#4B4D46;}

/* ---------- stack ---------- */
.stack-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);background:var(--card);margin-bottom:20px;box-shadow:5px 5px 0 rgba(23,25,28,.08);}
.stack-col{padding:24px 22px;border-right:1px solid var(--line);}
.stack-col:last-child{border-right:none;}
.stack-cat{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.stack-col ul{list-style:none;}
.stack-col li{font-family:var(--mono);font-size:12.5px;padding:5px 0;display:flex;align-items:center;gap:9px;transition:transform .3s var(--ease);}
.stack-col li:hover{transform:translateX(5px);}
.stack-col li::before{content:'▪';color:var(--stamp);font-size:9px;}
.stack-col li.core{font-weight:700;}
.stack-foot{font-family:var(--mono);font-size:10px;font-style:italic;color:var(--muted);margin-bottom:76px;padding-left:4px;}

/* ---------- experiencia ---------- */
.exp-log{margin-bottom:80px;border-top:1px solid var(--ink);}
.exp-entry{display:grid;grid-template-columns:200px 1fr;gap:40px;padding:38px 0;border-bottom:1px solid var(--line-strong);}
.exp-when{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);line-height:1.9;}
.exp-when .tag{display:inline-block;margin-top:8px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);padding:3px 9px;}
.exp-co{font-stretch:118%;font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:2px;}
.exp-ro{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);font-weight:700;margin-bottom:16px;}
.exp-ul{list-style:none;max-width:720px;}
.exp-ul li{font-size:14px;line-height:1.7;color:#34362F;padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--line);}
.exp-ul li:last-child{border-bottom:none;}
.exp-ul li::before{content:'→';position:absolute;left:0;top:7px;font-family:var(--mono);font-size:12px;color:var(--stamp);}

/* ---------- proyectos ---------- */
.proj-feat{border:1px solid var(--ink);background:var(--card);display:grid;grid-template-columns:1.25fr 1fr;position:relative;margin-bottom:26px;box-shadow:6px 6px 0 rgba(23,25,28,.08);}
.pf-main{padding:42px 40px 38px;border-right:1px solid var(--line);}
.pf-stamp{position:absolute;top:22px;right:26px;transform:rotate(6deg);border:2.5px solid var(--ok);color:var(--ok);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;line-height:1.5;text-align:center;transition:transform .4s var(--ease);}
.pf-stamp:hover{transform:rotate(2deg) scale(1.05);}
.pf-stamp::after{content:'';position:absolute;inset:2px;border:1px solid var(--ok);opacity:.4;}
.proj-code{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px;}
.proj-name{font-stretch:118%;font-weight:800;font-size:clamp(26px,3vw,38px);text-transform:uppercase;line-height:.95;letter-spacing:-.01em;margin-bottom:16px;}
.proj-desc{font-size:14.5px;line-height:1.75;color:#34362F;margin-bottom:22px;max-width:520px;}
.ptags{display:flex;flex-wrap:wrap;gap:6px;}
.ptag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line-strong);color:#4B4D46;background:var(--paper);transition:all .25s var(--ease);}
.ptag:hover{border-color:var(--ink);transform:translateY(-2px);}
.pf-data{padding:42px 32px;display:flex;flex-direction:column;}
.pfd-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
.pfd-row:first-child{padding-top:0;}
.pfd-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;}
.pfd-v{font-family:var(--mono);font-size:12px;font-weight:500;text-align:right;}
.pfd-v.big{font-stretch:118%;font-family:var(--sans);font-weight:800;font-size:34px;color:var(--stamp);line-height:1;font-variant-numeric:tabular-nums;}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:80px;}
.proj-card{border:1px solid var(--line-strong);background:var(--card);padding:34px 32px;display:flex;flex-direction:column;transition:transform .45s var(--ease),border-color .3s,box-shadow .45s var(--ease);}
.proj-card:nth-child(2){margin-top:34px;}
.proj-card:hover{border-color:var(--ink);transform:translate(-4px,-4px);box-shadow:8px 8px 0 rgba(23,25,28,.09);}
.proj-card .proj-name{font-size:24px;}
.proj-card .proj-desc{flex:1;font-size:13.5px;}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.status-line.ok{color:var(--ok);}
.status-line.dev{color:var(--stamp);}

/* ---------- certificaciones ---------- */
.cert-list{border-top:1px solid var(--ink);margin-bottom:80px;}
.cert-row{display:grid;grid-template-columns:180px 1fr 60px;gap:24px;align-items:baseline;padding:15px 8px;border-bottom:1px solid var(--line-strong);transition:background .25s,padding-left .35s var(--ease);}
.cert-row:hover{background:var(--card);padding-left:18px;}
.cert-iss{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.cert-name{font-size:15.5px;font-weight:600;}
.cert-name small{font-weight:400;color:var(--muted);font-size:12px;}
.cert-yr{font-family:var(--mono);font-size:11px;color:var(--stamp);font-weight:700;text-align:right;}
.cert-more{padding:16px 8px;font-family:var(--mono);font-size:11px;font-style:italic;color:var(--muted);letter-spacing:.04em;}

/* ---------- contacto ---------- */
#contacto{border-bottom:none;}
.contact-wrap{padding:96px 0 104px;position:relative;}
.contact-title{font-size:clamp(50px,9vw,118px);margin:16px 0 28px;}
.contact-title .outline{color:transparent;-webkit-text-stroke:1.5px var(--ink);transition:color .5s var(--ease);}
.contact-title:hover .outline{color:var(--ink);}
.contact-sub{font-size:17px;color:#4B4D46;max-width:520px;margin-bottom:46px;line-height:1.7;}
.clinks{display:flex;gap:14px;flex-wrap:wrap;}
.clink{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;padding:16px 26px;border:1px solid var(--ink);background:var(--card);display:inline-flex;align-items:center;gap:9px;font-weight:500;position:relative;overflow:hidden;transition:color .3s var(--ease),transform .35s var(--ease);}
.clink::before{content:'';position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .4s var(--ease);}
.clink span{position:relative;z-index:1;}
.clink:hover{color:var(--paper);transform:translateY(-3px);}
.clink:hover::before{transform:translateY(0);}
.contact-stamp{position:absolute;right:4px;top:100px;transform:rotate(8deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:14px 22px;user-select:none;transition:transform .4s var(--ease);}
.contact-stamp:hover{transform:rotate(4deg) scale(1.05);}
.contact-stamp::after{content:'';position:absolute;inset:3px;border:1px solid var(--stamp);opacity:.4;}

/* ---------- footer ---------- */

<script>
// ---------- idioma ----------
function setLang(l){
  document.getElementById('body').classList.toggle('en', l==='en');
  document.getElementById('bEs').classList.toggle('active', l==='es');
  document.getElementById('bEn').classList.toggle('active', l==='en');
  document.documentElement.lang = l;
}

var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var finePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

// ---------- cursor: punto instantáneo + anillo que persigue con lerp ----------
if (finePointer && !reduced){
  var cur = document.getElementById('cur');
  var ring = document.getElementById('cur-ring');
  var mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
  document.addEventListener('mousemove', function(e){
    mx = e.clientX; my = e.clientY;
    cur.style.transform = 'translate('+(mx-4)+'px,'+(my-4)+'px)';
  });
  (function loop(){
    rx += (mx-rx)*0.13;
    ry += (my-ry)*0.13;
    ring.style.transform = 'translate('+(rx-ring.offsetWidth/2)+'px,'+(ry-ring.offsetHeight/2)+'px)';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,.hoverable').forEach(function(el){
    el.addEventListener('mouseenter', function(){ ring.classList.add('big'); });
    el.addEventListener('mouseleave', function(){ ring.classList.remove('big'); });
  });
}

// ---------- reloj Asunción ----------
function tick(){
  try{
    var t = new Intl.DateTimeFormat('es-PY',{timeZone:'America/Asuncion',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
    document.getElementById('clock').textContent = 'ASU ' + t;
  }catch(e){}
}
tick(); setInterval(tick,1000);

// ---------- scramble del nombre al cargar ----------
if(!reduced){
  var el = document.getElementById('scramble');
  var target = el.textContent;
  var chars = '01<>/{}[]#$%&=?';
  var frame = 0, total = 26;
  (function scr(){
    var out = '';
    for(var i=0;i<target.length;i++){
      out += (i < frame/total*target.length*1.4) ? target[i] : chars[Math.floor(Math.random()*chars.length)];
    }
    el.textContent = out;
    if(frame++ < total){ setTimeout(scr, 34); } else { el.textContent = target; }
  })();
}

// ---------- contador -87% ----------
var counted = false;
function runCounter(){
  if(counted || reduced){ if(reduced){document.getElementById('counter').innerHTML='−87<em>%</em>';} return; }
  counted = true;
  var el = document.getElementById('counter');
  var n = 0, target = 87;
  var iv = setInterval(function(){
    n += Math.ceil((target-n)/9) || 1;
    if(n>=target){ n=target; clearInterval(iv); }
    el.innerHTML = '−'+n+'<em>%</em>';
  }, 40);
}
setTimeout(runCounter, 600);

// ---------- reveals con dirección ----------
var obs = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); obs.unobserve(e.target); } });
},{threshold:0.08});
document.querySelectorAll('.rev,.rev-l,.rev-r').forEach(function(el){ obs.observe(el); });

// ---------- nav activa ----------
var secs = document.querySelectorAll('section');
var links = document.querySelectorAll('.tb-nav a');
window.addEventListener('scroll', function(){
  var cur='';
  secs.forEach(function(s){ if(window.scrollY >= s.offsetTop-160) cur=s.id; });
  links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+cur); });
},{passive:true});
</script>
